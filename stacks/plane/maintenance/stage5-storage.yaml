services:
  plane-minio:
    image: ${PLANE_STORAGE_TARGET_IMAGE:-pgsty/silo:RELEASE.2026-09-16T00-00-00Z}
    # The image entrypoint wrapper dispatches silo; no minio executable alias.
    command: [server, /export, --console-address, ":9090"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?Preserve the existing storage user}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?Preserve the existing storage password}
