status_page:
  slug: ops-board
  title: Ops Board

monitors:
  - name: Homepage
    type: http
    url: http://host.docker.internal:3000
    accepted_statuscodes: ["200-299"]
  - name: Uptime Kuma
    type: http
    url: http://host.docker.internal:3001
    accepted_statuscodes: ["200-399"]
  - name: SigNoz UI
    type: http
    url: http://host.docker.internal:8080/api/v1/health
    accepted_statuscodes: ["200-299"]
  - name: SigNoz Collector
    type: http
    url: http://host.docker.internal:13133/
    accepted_statuscodes: ["200-299"]
  - name: Plane
    type: http
    url: http://host.docker.internal:8082
    accepted_statuscodes: ["200-399"]
  - name: Dummy API Health
    type: http
    url: http://host.docker.internal:18080/health
    accepted_statuscodes: ["200-299"]
    optional: true

# Project monitors are Git-managed and appear only in the Uptime Kuma dashboard.
# They are intentionally excluded from the core ops-board status page and Homepage widget.
project_monitors:
  - id: spark-h3-gateway
    name: Spark H3 Gateway
    url: http://100.64.35.71:8090/health
    accepted_statuscodes: ["200-299"]
